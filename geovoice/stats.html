<body style="font-family: sans-serif; background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">
    <div style="background: rgba(30, 41, 59, 0.8); padding: 30px; border-radius: 16px; border: 1px solid #a855f7; text-align: center;">

    <script>
        const SUPABASE_URL = "https://pcmrfidgxfhfdfqzxwum.supabase.co";
        const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBjbXJmaWRneGZoZmRmcXp4d3VtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgxNTM3NDUsImV4cCI6MjEwMzcyOTc0NX0.9GJfG6L8TWfD77ja0iXU-DUJhryxBmTzQRSa7739x0Y";
        
        const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function getCount() {
            const { count, error } = await client
                .from('installations')
                .select('*', { count: 'exact', head: true });
            
            if (!error) {
                document.getElementById('count').innerText = count;
            } else {
                document.getElementById('count').innerText = "Error";
            }
        }

        getCount();
    </script>
